services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: svetofor_secret
      POSTGRES_DB: svetofor_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d svetofor_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./core/settings.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres              # ← теперь совпадает с POSTGRES_USER
      DB_PASS: svetofor_secret
      DB_NAME: svetofor_db
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt

volumes:
  pg_data:
